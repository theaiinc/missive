# ── WARNING ─────────────────────────────────────────────────────
+# Never run `docker compose down -v` — it destroys the database volume.
+# Use `docker compose down` (without -v) to stop cleanly.
+# To back up:  docker run --rm -v missive_pgdata:/data -v .:/backup alpine tar czf /backup/pg-backup.tar.gz -C /data .
+# To restore:  docker run --rm -v missive_pgdata:/data -v .:/backup alpine tar xzf /backup/pg-backup.tar.gz -C /data
+# ────────────────────────────────────────────────────────────────
version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: missive-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: missive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - missive_pgdata:/var/lib/postgresql/data
      - ./.docker/init:/docker-entrypoint-initdb.d

volumes:
  missive_pgdata:
