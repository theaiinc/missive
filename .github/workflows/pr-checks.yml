name: Pull request checks

on:
  pull_request:

jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared core package
        run: pnpm --filter @theaiinc/missive-core build

      - name: Run backend tests
        run: pnpm --filter @theaiinc/missive-backend test

      - name: Build web
        run: pnpm --filter @theaiinc/missive-web build