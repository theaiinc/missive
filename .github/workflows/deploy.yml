# Deploys missive.theaiinc.com: the web app, the edge Worker and the API
# container (packages/edge). Needs the CLOUDFLARE_API_TOKEN repository secret
# (Workers Scripts, Containers, R2, Email Sending and Workers Routes: Edit).
name: Deploy

on:
  push:
    branches: [main, hosted-mailboxes]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the API
        run: pnpm --filter @theaiinc/missive-core run build && pnpm --filter @theaiinc/missive-backend run lint
      - name: Typecheck the edge Worker
        run: pnpm --filter @theaiinc/missive-edge run typecheck
      - name: Build and deploy
        run: pnpm --filter @theaiinc/missive-edge run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
